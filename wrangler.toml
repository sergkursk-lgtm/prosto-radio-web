# Развёртывание прокси потоков в Cloudflare Workers.
#
# Этот файл нужен только для варианта «подключить репозиторий»: Cloudflare сам
# запускает `npx wrangler deploy`, и ему надо сказать, что именно разворачивать.
# Без него такой деплой падает — в репозитории нет точки входа.
#
# Если разворачиваешь вручную (Workers & Pages → Create Worker → вставить код),
# файл просто лежит и ничему не мешает.
#
# Зачем прокси: браузер блокирует http-аудио на https-странице, а мобильные
# операторы режут нестандартные порты — «Маруся ФМ» вещает на 8000 и 9433.
# Подробности — в README и в начале worker/stream-proxy.js.

name = "prosto-radio-web"
main = "worker/stream-proxy.js"
compatibility_date = "2026-09-01"

# Клиент обращается к воркеру именно по адресу workers.dev — он и есть точка входа.
# Preview URLs не нужны: это отдельные адреса на каждую сборку, лишняя поверхность.
workers_dev = true
preview_urls = false

# Сайт раздаётся с GitHub Pages, воркер занимается только потоками.
# assets намеренно не подключены: воркер не должен отдавать статику.
